name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt pytest pyflakes shellcheck-py
      - run: pyflakes clipper tests
      - run: shellcheck -S warning deploy/*.sh deploy/mac/*.sh deploy/mac/tunnel/*.sh
      - run: python -m pytest -q

  docker-amd64:
    # The image on a normal (x86) server, plus the HTTPS config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t clipper .
      - name: Smoke test
        run: |
          cp config.example.yaml config.yaml
          docker run --rm -v "$PWD/config.yaml:/app/config.yaml" clipper --help
          docker run --rm --entrypoint python clipper -c "import faster_whisper, ctranslate2, curl_cffi, av, numpy; print('imports ok')"
      - name: Caddyfile is valid (with and without the backup address)
        run: |
          for alt in 1-2-3-4.nip.io ""; do
            docker run --rm -e DOMAIN=1-2-3-4.sslip.io -e DOMAIN_ALT="$alt" \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - run: touch .env && docker compose config -q

  install-arm64:
    # Runs the real one-line installer on an ARM64 Ubuntu machine, like Oracle's free servers.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Run deploy/install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo REPO="${{ github.repository }}" BRANCH="${{ github.head_ref || github.ref_name }}" \
            GH_TOKEN="$GH_TOKEN" DOMAIN=localhost DOMAIN_ALT= bash deploy/install.sh
      - name: Check the installed bot
        run: |
          set -x
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/healthz
          curl -fsSk https://localhost/privacy | grep -q "Privacy policy"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/setup)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/openapi.json)" = 404
          head -c 3000000 /dev/zero > big.bin
          code=$(curl -sk -o /dev/null -w '%{http_code}' -F file=@big.bin https://localhost/setup/tiktok-verify)
          case "$code" in 401|200|422) echo "a 3 MB upload got through Caddy ($code)"; exit 1 ;; esac
          clipper status
          cd /opt/gta6-clipper
          sudo docker compose exec -T clipper uname -m | grep -q aarch64
          sudo docker compose exec -T clipper python -c "import faster_whisper, ctranslate2, curl_cffi, av, numpy; print('arm64 imports ok')"
          sudo docker compose exec -T clipper python -m clipper doctor || true
      - name: Installer is safe to run twice
        run: |
          # Second run without GH_TOKEN: keeps the password and the token stored for git.
          before=$(sudo grep DASHBOARD_PASSWORD /opt/gta6-clipper/.env)
          sudo REPO="${{ github.repository }}" BRANCH="${{ github.head_ref || github.ref_name }}" \
            DOMAIN=localhost DOMAIN_ALT= bash deploy/install.sh
          test "$before" = "$(sudo grep DASHBOARD_PASSWORD /opt/gta6-clipper/.env)"
          sudo git -C /opt/gta6-clipper remote get-url origin | grep -q x-access-token
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/healthz
      - name: Nightly update has nothing to do right after an install
        run: sudo /opt/gta6-clipper/deploy/update.sh | tee /dev/stderr | grep -q "already up to date"
      - name: Logs on failure
        if: failure()
        run: |
          cd /opt/gta6-clipper 2>/dev/null && sudo docker compose logs --tail 200 || true

  home-computer:
    # The Mac setup (deploy/mac/install-mac.sh + docker-compose.mac.yml), run on Linux: same
    # Docker Compose stack, with the Cloudflare quick tunnel instead of Caddy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run the Mac installer
        run: |
          ALLOW_NON_MAC=1 REPO="${{ github.repository }}" BRANCH="${{ github.head_ref || github.ref_name }}" \
            APP_DIR="$RUNNER_TEMP/GTA6-Clipper" bash deploy/mac/install-mac.sh
      - name: Check the bot and its public address
        run: |
          set -x
          cd "$RUNNER_TEMP/GTA6-Clipper"
          curl -fsS http://127.0.0.1:8080/healthz
          pw=$(grep '^DASHBOARD_PASSWORD=' .env | cut -d= -f2-)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/setup)" = 401
          curl -fsS -u "admin:$pw" http://127.0.0.1:8080/setup > /dev/null
          # the bot picks up the tunnel's address by itself (checked every 20 s)
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml -f docker-compose.mac.yml logs clipper | grep -q "public address is now https://" && break
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.mac.yml logs clipper | grep "public address is now https://"
          url=$(docker compose -f docker-compose.yml -f docker-compose.mac.yml logs clipper | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -n 1)
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$url/privacy" | grep -q "Privacy policy"
          # caddy isn't started on a home computer
          test -z "$(docker compose -f docker-compose.yml -f docker-compose.mac.yml ps -q caddy)"
      - name: Running it again keeps the password
        run: |
          before=$(grep DASHBOARD_PASSWORD "$RUNNER_TEMP/GTA6-Clipper/.env")
          ALLOW_NON_MAC=1 REPO="${{ github.repository }}" BRANCH="${{ github.head_ref || github.ref_name }}" \
            APP_DIR="$RUNNER_TEMP/GTA6-Clipper" bash deploy/mac/install-mac.sh
          test "$before" = "$(grep DASHBOARD_PASSWORD "$RUNNER_TEMP/GTA6-Clipper/.env")"
      - name: Logs on failure
        if: failure()
        run: cd "$RUNNER_TEMP/GTA6-Clipper" && docker compose -f docker-compose.yml -f docker-compose.mac.yml logs --tail 100 || true
