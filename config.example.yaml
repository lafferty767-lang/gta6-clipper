# Twitch "discovery": lists the biggest GTA 6 streams in the dashboard so you can add them above.
discovery:
  enabled: true
  interval_minutes: 15
  languages: [en]
  top: 25

# ---------------------------------------------------------------------------------------
# Moment detection. Score = chat_z*chat + hype_z*hype + audio_z*audio + viewer_clips*viewer_clip
# Raise `threshold` if you get too many boring clips, lower it if you get too few.
# ---------------------------------------------------------------------------------------
detection:
  threshold: 6.0
  weights: {chat: 1.0, hype: 1.0, audio: 0.8, viewer_clip: 3.0}
  clip_before_seconds: 25        # footage kept before the moment
  clip_after_seconds: 15         # footage kept after it (extended while chat keeps going)
  max_clip_seconds: 59
  min_gap_seconds: 90            # no two clips from the same stream closer than this
  max_clips_per_stream_hour: 6
  warmup_seconds: 120            # learn the stream's normal chat speed/volume before clipping
  buffer_seconds: 300
  # hype_keywords: [...]         # override the default emote/keyword list

# AI judge + titles (needs ANTHROPIC_API_KEY). Without a key, clips get template titles.
llm:
  enabled: true
  model: claude-opus-5-5
  min_score: 6                   # clips the AI scores below this are parked as "low score"

whisper:
  model: small                   # tiny | base | small | medium (bigger = better captions, slower)
  device: cpu
  compute_type: int8

edit:
  layout: auto                   # auto: streamer's webcam on top half + gameplay below (webcam found
                                 # automatically, or a streamer's facecam box), else blur | split | blur
  captions: true
  credit_overlay: true           # shows "<streamer> live on twitch.tv/..." on the video
  crf: 21
  preset: veryfast

# ---------------------------------------------------------------------------------------
# Uploads. Each target needs its keys in .env (see SETUP.md). Targets without keys are skipped.
# ---------------------------------------------------------------------------------------
uploads:
  max_per_day: 5                 # across all streamers; 5 also matches TikTok's 5 waiting drafts a day
  min_minutes_between: 20
  targets:
    youtube:
      enabled: true
      privacy: public            # public | unlisted | private
    tiktok:
      enabled: true
      mode: inbox                # inbox = lands in your TikTok drafts (works before app audit) | direct
    metricool:
      enabled: false             # schedule through Metricool instead of posting directly
      networks: [tiktok, youtube, instagram]
      schedule_delay_minutes: 10
      timezone: America/Los_Angeles
    local:
      enabled: true              # also copy every approved clip to data/exports
      folder: /data/exports
