# GTA 6 Clipper config. Copy to config.yaml and edit. The bot reloads this file automatically
# when you save it (no restart needed).

# true  = every clip waits in the dashboard until you press Approve (recommended to start)
# false = clips that pass the AI check upload automatically
review_mode: true

# Uploading someone else's stream without permission can get your channels struck or banned.
# With this on, a streamer's clips are only uploaded when their `permission` below is "granted".
require_permission_to_upload: true
# false = only record and clip streamers whose permission is "granted" (saves your computer's CPU
# and keeps the review list to clips you can post). true = clip everyone, so you can see what the bot finds.
clip_without_permission: false

poll_interval_seconds: 60        # how often to check who is live
max_concurrent_streams: 4        # each stream uses ~3-6 Mbps download + some CPU
stream_quality: "720p60,720p,best"   # 720p keeps bandwidth down; it's plenty for 1080x1920 shorts

# Text that counts as "playing GTA 6" (matched against the stream's game/category and title)
game_match: ["grand theft auto vi", "grand theft auto 6", "gta 6", "gta vi", "gta6", "gtavi"]

# ---------------------------------------------------------------------------------------
# Streamers. platforms: twitch = login, kick = slug, youtube = @handle (or channel id).
# permission: granted | unknown | denied   (see STREAMERS.md for how to get permission)
# campaign_url: optional; where you submit posted clips for a paid clipping campaign
# facecam: optional box for the split layout, as fractions of the frame (x, y, w, h).
#   Example for a facecam in the bottom-left quarter:  {x: 0.0, y: 0.7, w: 0.22, h: 0.3}
# game_check: set false for streamers who don't tag the game (clips anything they stream)
# ---------------------------------------------------------------------------------------
